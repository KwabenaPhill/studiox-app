<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio X">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Studio X 1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Studio X 1.0 (Philip, 1 Nov 2026): one app for every content channel on the content phone.
   Style 1 "Studio Dark": black, cyan > violet > pink (from the logo). New looks = new numbered styles. */
:root{--f:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--bg:#05060A;--card:#111218;--card2:#181A22;--line:#262833;
  --cyan:#22D3EE;--violet:#8B5CF6;--pink:#F472B6;--green:#30D158;--red:#FF453A;--yellow:#FFD60A;--mute:#C9C9C9;--dim:#8A8A8A;
  --grad:linear-gradient(135deg,#22D3EE,#8B5CF6 55%,#F472B6);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:#fff;font-family:var(--f);min-height:100%;max-width:480px;margin:0 auto;padding-bottom:96px}
button,input,select,textarea{font-family:var(--f)}
.app-header{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 16px 6px}
.app-header img{width:34px;height:34px;border-radius:10px}
.app-header h1{font-size:24px;font-weight:900;letter-spacing:.5px}
.app-header h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.app-header .ver{font-size:11px;color:#666;font-weight:700;margin-left:2px}
.app-sub{text-align:center;font-size:10px;letter-spacing:4px;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#0B0C11;border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{position:relative;flex:1;padding:13px 4px 11px;background:none;border:none;color:var(--mute);font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav-btn .ni{font-size:19px;transition:transform .18s}
.nav-btn::before{content:'';position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--grad);border-radius:0 0 3px 3px;transform:scaleX(0);transition:transform .2s}
.nav-btn.active::before{transform:scaleX(1)}.nav-btn.active{color:#fff}.nav-btn.active .ni{transform:translateY(-1px) scale(1.12)}
.page{display:none;padding:10px 16px}.page.active{display:block;animation:pageIn .25s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:18px;font-weight:800;margin:14px 0 8px}
.muted{color:var(--dim);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900}.stat span{font-size:11px;color:var(--dim);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px 6px 6px;font-size:13px;font-weight:700;color:#fff}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;flex:none}
.av.big{width:52px;height:52px;font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;cursor:pointer;position:relative}
.ch .av{margin:0 auto 8px}.ch h4{font-size:14px;font-weight:800}.ch small{color:var(--dim);font-size:11px;font-weight:600}
.ch.off{opacity:.45}.ch .cnt{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;color:var(--cyan)}
.ch.add{border-style:dashed;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;font-weight:800}
.post{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;cursor:pointer;border-left:4px solid var(--c,#555)}
.post .th{width:72px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:#000}
.post .mid{flex:1;min-width:0}
.post .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .m{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px}
.ticks{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tk{font-size:10px;font-weight:800;padding:2px 6px;border-radius:8px;background:#22242c;color:#777}
.tk.on{background:rgba(48,209,88,.16);color:var(--green)}
.late{color:var(--red)!important}
.day{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:1px;text-transform:uppercase;margin:16px 0 2px}
.bar{display:flex;gap:8px;margin:8px 0}
select,input[type=text],input[type=url],input[type=datetime-local],input[type=number],textarea{width:100%;background:#0c0d12;color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px}
textarea{min-height:80px;line-height:1.4}
.btn{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.btn.main{background:var(--grad);border:0;color:#fff}
.btn.red{background:rgba(255,69,58,.15);color:var(--red);border-color:rgba(255,69,58,.3)}
.btn.sm{flex:none;padding:7px 10px;font-size:12px;border-radius:10px}
.fab{position:fixed;right:16px;bottom:86px;width:56px;height:56px;border-radius:28px;border:0;background:var(--grad);color:#fff;font-size:30px;font-weight:300;z-index:90;box-shadow:0 8px 22px rgba(139,92,246,.45)}
.sheet{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:none}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;overflow:auto;background:#101117;border-radius:22px 22px 0 0;padding:16px 16px 30px}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.f{margin:10px 0}.f label{display:block;font-size:12px;font-weight:800;color:var(--mute);margin-bottom:5px}
.f .help{font-size:12px;color:var(--dim);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{display:flex;flex-wrap:wrap;gap:8px}
.tg button{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#16171e;color:#aaa;font-weight:700;font-size:13px}
.tg button.on{background:rgba(48,209,88,.16);color:var(--green);border-color:rgba(48,209,88,.4)}
.cp{display:flex;gap:6px;align-items:flex-start}.cp>*:first-child{flex:1}
.set{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.set .top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.set .help{font-size:12px;color:var(--dim);margin-top:4px}
.sw{position:relative;width:46px;height:28px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#2a2c36;border-radius:14px;transition:.2s}.sw span::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--violet)}.sw input:checked+span::after{transform:translateX(18px)}
.set select{width:auto;min-width:120px;padding:7px}
.colors{display:flex;gap:8px;flex-wrap:wrap}.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.colors button.on{border-color:#fff}
.empty{text-align:center;color:var(--dim);padding:26px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#000;font-weight:800;padding:10px 16px;border-radius:14px;z-index:300;display:none;font-size:14px}
.feedline{font-size:12px;color:var(--dim);text-align:center;margin:2px 0 6px}
</style>
</head>
<body>
<div class="app-header"><img src="icons/icon-192.png" alt=""><h1>Studio <b>X</b></h1><span class="ver" id="ver"></span></div>
<div class="app-sub">All my channels · one place</div>
<div class="feedline" id="feedLine"></div>

<section class="page active" id="p-home"></section>
<section class="page" id="p-channels"></section>
<section class="page" id="p-plan"></section>
<section class="page" id="p-more"></section>

<button class="fab" id="fab" title="New post">+</button>
<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="home"><span class="ni">🏠</span>Today</button>
  <button class="nav-btn" data-tab="channels"><span class="ni">📺</span>Channels</button>
  <button class="nav-btn" data-tab="plan"><span class="ni">📅</span>Plan</button>
  <button class="nav-btn" data-tab="more"><span class="ni">⚙️</span>More</button>
</nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileThumb" accept="image/*" style="display:none">
<input type="file" id="fileImport" accept=".json,application/json" style="display:none">

<script>
(function(){
VERSION='1.0';
const $=id=>document.getElementById(id);
$('ver').textContent='v'+VERSION;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1800);};
const COLORS=['#22D3EE','#8B5CF6','#F472B6','#30D158','#FF9F0A','#FF453A','#FFD60A','#32ADE6','#BF5AF2','#A3E635','#94A3B8'];
const KINDS=['Video','Short','TikTok','Post','Idea'];
const TICKS=[['script','Script'],['build','Built'],['thumb','Thumbnail'],['text','Title + text'],['upload','Uploaded']];
/* Starting channels (Philip's content phone). Add more any time with "+ Add channel". Turning off hides, never deletes. */
const START=[
 ['RankX Football','YouTube','#A3E635','R'],['Device Guardian','YouTube','#FF453A','D'],['Xtech Guides','YouTube','#32ADE6','X'],
 ['Cine Cascade','YouTube','#FFD60A','C'],['Game Zeus','YouTube','#30D158','G'],['Vellox Play','YouTube','#3B82F6','V'],
 ['Gen2 Solutions','YouTube','#8B5CF6','G'],['Ink Age','YouTube','#BF5AF2','I'],['Movie Zone','YouTube','#FF9F0A','M'],
 ['TikTok','TikTok','#F472B6','T']];
/* SETTINGS: every setting has a plain help line. Defaults = how the app behaves now. */
const SETTINGS=[
 {k:'startTab',t:'Open on',type:'sel',opts:[['home','Today'],['channels','Channels'],['plan','Plan']],d:'home',h:'Which page the app shows when you open it.'},
 {k:'planPeriod',t:'Plan shows by default',type:'sel',opts:[['week','This week'],['month','This month'],['year','This year'],['all','All time']],d:'week',h:'The starting period on the Plan page. You can still change it there.'},
 {k:'showOff',t:'Show turned-off channels',type:'sw',d:false,h:'On = turned-off channels still show (faded). Off = they are hidden. Nothing is deleted.'},
 {k:'showDone',t:'Show uploaded posts on Today',type:'sw',d:false,h:'On = uploaded posts stay on the Today page. Off = Today only shows what still needs work.'},
 {k:'lateRed',t:'Late posts in red',type:'sw',d:true,h:'A post past its time and not uploaded shows its time in red.'},
 {k:'askDelete',t:'Ask before deleting',type:'sw',d:true,h:'Shows a "Delete?" question before a post or channel is removed for good.'},
 {k:'feedOn',t:'Bot feed (laptop bots)',type:'sw',d:true,h:'On = the app reads what your channel bots send (builds, uploads, schedule) from your private mailbox. Uses the same key as Fix notes "Laptop sync". Off = only what you type here.'},
 {k:'feedMins',t:'Check the bot feed every (minutes)',type:'num',d:5,min:1,max:60,h:'How often the app looks for new bot news while it is open.'},
 {k:'style',t:'Look',type:'sel',opts:[['1','1. Studio Dark']],d:'1',h:'The app style. New looks are added as new numbers; this one always stays.'}];

/* ---------- storage (IndexedDB, survives app updates) ---------- */
let S={channels:[],posts:[],settings:{},feed:{last:0,sha:''}};
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('studiox',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
async function load(){try{const d=await idb();const v=await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get('data');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null);});if(v)S=Object.assign(S,v);}catch(e){}
  if(!S.channels.length)S.channels=START.map((c,i)=>({id:'c'+(i+1),name:c[0],platform:c[1],color:c[2],letter:c[3],url:'',on:true,note:''}));
  for(const s of SETTINGS)if(!(s.k in S.settings))S.settings[s.k]=s.d;}
let st=null;function save(){clearTimeout(st);st=setTimeout(async()=>{try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(S,'data');}catch(e){toast('Could not save!');}},150);}
const set=k=>S.settings[k];
const chOf=id=>S.channels.find(c=>c.id===id)||{name:'?',color:'#555',letter:'?'};
const chOn=c=>c.on||set('showOff');

/* ---------- dates ---------- */
const now=()=>new Date();
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function dayName(k){const t=dayKey(now()),tm=dayKey(Date.now()+864e5),y=dayKey(Date.now()-864e5);if(k===t)return 'Today';if(k===tm)return 'Tomorrow';if(k===y)return 'Yesterday';
  return new Date(k+'T12:00').toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'});}
const tm=w=>new Date(w).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
function inPeriod(w,p){if(p==='all')return true;if(!w)return p==='none';const d=new Date(w),n=now();
  if(p==='week'){const s=new Date(n);s.setHours(0,0,0,0);s.setDate(s.getDate()-((s.getDay()+6)%7));const e=new Date(s);e.setDate(e.getDate()+7);return d>=s&&d<e;}
  if(p==='month')return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
  if(p==='year')return d.getFullYear()===n.getFullYear();return false;}
const isDone=p=>!!(p.ticks&&p.ticks.upload);
const isLate=p=>p.when&&!isDone(p)&&new Date(p.when)<now();

/* ---------- drawing ---------- */
function postCard(p){const c=chOf(p.ch);const late=isLate(p)&&set('lateRed');
  return `<div class="post" style="--c:${c.color}" data-post="${p.id}">${p.thumb?`<img class="th" src="${p.thumb}">`:''}<div class="mid">
  <div class="t">${esc(p.title||'(no title)')}</div>
  <div class="m"><span style="color:${c.color}">${esc(c.name)}</span> · ${esc(p.kind)}${p.when?` · <span class="${late?'late':''}">${dayName(dayKey(p.when))} ${tm(p.when)}</span>`:''}${p.src==='bot'?' · 🤖':''}</div>
  <div class="ticks">${TICKS.map(([k,n])=>`<span class="tk ${p.ticks&&p.ticks[k]?'on':''}">${p.ticks&&p.ticks[k]?'✓ ':''}${n}</span>`).join('')}</div></div></div>`;}
function grouped(list){if(!list.length)return '<div class="empty">Nothing here yet. Tap + to add a post.</div>';
  const g={},nd=[];list.forEach(p=>{if(!p.when){nd.push(p);return;}(g[dayKey(p.when)]=g[dayKey(p.when)]||[]).push(p);});
  let h=Object.keys(g).sort().map(k=>`<div class="day">${dayName(k)}</div>`+g[k].sort((a,b)=>a.when.localeCompare(b.when)).map(postCard).join('')).join('');
  if(nd.length)h+=`<div class="day">No date · ideas</div>`+nd.map(postCard).join('');return h;}
const live=()=>S.posts.filter(p=>!p.hidden&&chOn(chOf(p.ch)));

function drawHome(){const L=live();const today=dayKey(now());
  const due=L.filter(p=>p.when&&dayKey(p.when)===today&&!isDone(p)).length;
  const late=L.filter(isLate).length;const up=L.filter(p=>isDone(p)&&inPeriod(p.when,'week')).length;
  const list=L.filter(p=>p.when&&(dayKey(p.when)<=dayKey(Date.now()+864e5))&&(set('showDone')||!isDone(p))&&(dayKey(p.when)>=today||!isDone(p)));
  const chs=S.channels.filter(chOn);
  $('p-home').innerHTML=`<div class="stats"><div class="stat"><b>${due}</b><span>Due today</span></div><div class="stat"><b class="${late?'late':''}">${late}</b><span>Late</span></div><div class="stat"><b style="color:var(--green)">${up}</b><span>Uploaded this week</span></div></div>
  <div class="chips">${chs.map(c=>{const n=L.filter(p=>p.ch===c.id&&!isDone(p)).length;return `<button class="chip" data-chan="${c.id}"><span class="av" style="background:${c.color}">${esc(c.letter)}</span>${esc(c.name)}${n?` · ${n}`:''}</button>`;}).join('')}</div>
  <h2>Today, late and tomorrow</h2>${grouped(list)}`;}
function drawChannels(){const L=live();
  $('p-channels').innerHTML=`<h2>My channels</h2><div class="grid">${S.channels.filter(chOn).map(c=>{const n=L.filter(p=>p.ch===c.id&&!isDone(p)).length;
    return `<div class="ch ${c.on?'':'off'}" data-chan="${c.id}">${n?`<span class="cnt">${n}</span>`:''}<div class="av big" style="background:${c.color}">${esc(c.letter)}</div><h4>${esc(c.name)}</h4><small>${esc(c.platform)}${c.on?'':' · off'}</small></div>`;}).join('')}
    <div class="ch add" id="addCh"><div style="font-size:30px">＋</div>Add channel</div></div>
    ${S.channels.some(c=>!c.on)&&!set('showOff')?`<p class="muted" style="margin-top:10px">${S.channels.filter(c=>!c.on).length} channel(s) turned off. Turn on "Show turned-off channels" in More to see them.</p>`:''}`;}
let planCh='all',planP=null;
function drawPlan(){if(planP===null)planP=set('planPeriod');
  const L=live().filter(p=>(planCh==='all'||p.ch===planCh)&&(planP==='none'?!p.when:inPeriod(p.when,planP)));
  $('p-plan').innerHTML=`<div class="bar"><select id="planCh"><option value="all">All channels</option>${S.channels.filter(chOn).map(c=>`<option value="${c.id}" ${planCh===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <select id="planP">${[['week','This week'],['month','This month'],['year','This year'],['all','All time'],['none','No date (ideas)']].map(o=>`<option value="${o[0]}" ${planP===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
  <p class="muted">${L.length} post(s) · ${L.filter(isDone).length} uploaded</p>${grouped(L)}`;
  $('planCh').onchange=e=>{planCh=e.target.value;drawPlan();};$('planP').onchange=e=>{planP=e.target.value;drawPlan();};}
function drawMore(){const hid=S.posts.filter(p=>p.hidden).length;
  $('p-more').innerHTML=`<h2>Settings</h2>${SETTINGS.map(s=>{const v=set(s.k);let ctl='';
    if(s.type==='sw')ctl=`<label class="sw"><input type="checkbox" data-set="${s.k}" ${v?'checked':''}><span></span></label>`;
    else if(s.type==='sel')ctl=`<select data-set="${s.k}">${s.opts.map(o=>`<option value="${o[0]}" ${String(v)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
    else ctl=`<span style="display:flex;gap:6px;align-items:center"><button class="btn sm" data-step="${s.k}" data-d="-1">−</button><b style="min-width:26px;text-align:center">${v}</b><button class="btn sm" data-step="${s.k}" data-d="1">+</button></span>`;
    return `<div class="set"><div class="top"><span>${s.t}</span>${ctl}</div><div class="help">${s.h}</div></div>`;}).join('')}
  <div class="bar"><button class="btn" id="defaults">↺ Back to default</button></div>
  <h2>Hidden posts</h2><p class="muted">${hid} hidden post(s). Hidden posts are kept, not deleted.</p>
  <div class="bar"><button class="btn" id="showHidden">👁 Show hidden posts</button></div>
  <h2>Backup</h2><p class="muted">Save all channels, posts and settings to a file. Do this before any big change.</p>
  <div class="bar"><button class="btn main" id="exp">⬇ Export</button><button class="btn" id="imp">⬆ Import</button></div>
  <h2>Bot feed</h2><p class="muted" id="feedInfo">${feedText()}</p>
  <div class="bar"><button class="btn" id="feedNow">🔄 Check now</button><button class="btn" id="upd">⟳ Check for app update</button></div>
  <p class="muted" style="text-align:center;margin-top:16px">Studio X v${VERSION} · data stays on this phone</p>`;}
function drawAll(){drawHome();drawChannels();drawPlan();drawMore();}

/* ---------- tabs ---------- */
function showTab(t){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='p-'+t));$('fab').style.display=t==='more'?'none':'block';scrollTo(0,0);}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* ---------- sheets ---------- */
const openSheet=h=>{$('sheetIn').innerHTML=h;$('sheet').style.display='block';};
const closeSheet=()=>{$('sheet').style.display='none';};
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});

let edit=null,thumbNew=undefined;
function postSheet(p,chId){thumbNew=undefined;
  edit=p?JSON.parse(JSON.stringify(p)):{id:'p'+Date.now(),ch:chId||(planCh!=='all'?planCh:(S.channels.find(c=>c.on)||{}).id),kind:'Video',title:'',caption:'',tags:'',when:'',link:'',notes:'',ticks:{},src:'phone'};
  const chs=S.channels.filter(c=>c.on||c.id===edit.ch);
  openSheet(`<h3>${p?'✏️ Edit post':'➕ New post'}</h3>
  <div class="row2"><div class="f"><label>Channel</label><select id="eCh">${chs.map(c=>`<option value="${c.id}" ${c.id===edit.ch?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
  <div class="f"><label>Type</label><select id="eKind">${KINDS.map(k=>`<option ${k===edit.kind?'selected':''}>${k}</option>`).join('')}</select></div></div>
  <div class="f"><label>Title</label><div class="cp"><input type="text" id="eTitle" value="${esc(edit.title)}" placeholder="Top 30 Most Valuable Footballers 2026/27 | ..."><button class="btn sm" data-copy="eTitle">Copy</button></div></div>
  <div class="f"><label>Post time</label><input type="datetime-local" id="eWhen" value="${esc(edit.when)}"><div class="help">Empty = an idea with no date yet.</div></div>
  <div class="f"><label>Steps done</label><div class="tg" id="eTicks">${TICKS.map(([k,n])=>`<button data-tk="${k}" class="${edit.ticks[k]?'on':''}">${edit.ticks[k]?'✓ ':''}${n}</button>`).join('')}</div></div>
  <div class="f"><label>Description / caption</label><div class="cp"><textarea id="eCap">${esc(edit.caption)}</textarea><button class="btn sm" data-copy="eCap">Copy</button></div></div>
  <div class="f"><label>Hashtags / tags</label><div class="cp"><input type="text" id="eTags" value="${esc(edit.tags)}" placeholder="#football #ranking"><button class="btn sm" data-copy="eTags">Copy</button></div></div>
  <div class="f"><label>Thumbnail</label><div id="eThumb">${edit.thumb?`<img src="${edit.thumb}" style="width:100%;border-radius:12px">`:''}</div>
    <div class="bar"><button class="btn" id="eThumbBtn">🖼️ ${edit.thumb?'Change':'Add'} thumbnail</button>${edit.thumb?'<button class="btn" id="eThumbDel">Remove</button>':''}</div></div>
  <div class="f"><label>Link (after upload)</label><div class="cp"><input type="url" id="eLink" value="${esc(edit.link)}" placeholder="https://youtu.be/..."><button class="btn sm" id="eOpen">Open</button></div></div>
  <div class="f"><label>Notes</label><textarea id="eNotes" style="min-height:60px">${esc(edit.notes)}</textarea></div>
  ${edit.src==='bot'?'<p class="muted">🤖 From the bot feed. Your ticks and notes are kept when the bot updates it.</p>':''}
  <div class="bar"><button class="btn main" id="eSave">Save</button><button class="btn" id="eClose">Close</button></div>
  ${p?`<div class="bar"><button class="btn" id="eDup">⧉ Copy as new</button><button class="btn" id="eHide">${p.hidden?'👁 Show again':'🙈 Hide'}</button><button class="btn red" id="eDel">Delete</button></div>`:''}`);
  $('eTicks').onclick=e=>{const b=e.target.closest('[data-tk]');if(!b)return;const k=b.dataset.tk;edit.ticks[k]=!edit.ticks[k];b.classList.toggle('on');b.textContent=(edit.ticks[k]?'✓ ':'')+TICKS.find(t=>t[0]===k)[1];};
  $('eThumbBtn').onclick=()=>$('fileThumb').click();
  if($('eThumbDel'))$('eThumbDel').onclick=()=>{thumbNew=null;$('eThumb').innerHTML='';};
  $('eOpen').onclick=()=>{const u=$('eLink').value.trim();if(u)window.open(u,'_blank');};
  $('eClose').onclick=closeSheet;
  $('eSave').onclick=()=>{const n=Object.assign(edit,{ch:$('eCh').value,kind:$('eKind').value,title:$('eTitle').value.trim(),when:$('eWhen').value,caption:$('eCap').value,tags:$('eTags').value,link:$('eLink').value.trim(),notes:$('eNotes').value,upd:Date.now()});
    if(thumbNew!==undefined)n.thumb=thumbNew;const i=S.posts.findIndex(x=>x.id===n.id);if(i<0)S.posts.push(n);else S.posts[i]=n;save();closeSheet();drawAll();toast('Saved ✓');};
  if(p){$('eDup').onclick=()=>{const c=JSON.parse(JSON.stringify(p));c.id='p'+Date.now();c.ticks={};c.link='';c.src='phone';c.title=c.title+' (copy)';S.posts.push(c);save();drawAll();postSheet(c);};
    $('eHide').onclick=()=>{p.hidden=!p.hidden;save();closeSheet();drawAll();toast(p.hidden?'Hidden (kept in More)':'Showing again');};
    $('eDel').onclick=()=>{if(set('askDelete')&&!confirm('Delete this post for good? (Hide keeps it.)'))return;S.posts=S.posts.filter(x=>x.id!==p.id);save();closeSheet();drawAll();};}}
$('fileThumb').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/im.width);const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);thumbNew=c.toDataURL('image/jpeg',.8);$('eThumb').innerHTML=`<img src="${thumbNew}" style="width:100%;border-radius:12px">`;};im.src=r.result;};r.readAsDataURL(f);};

function chanSheet(c){const L=S.posts.filter(p=>p.ch===c.id&&!p.hidden);
  openSheet(`<h3><span class="av" style="background:${c.color}">${esc(c.letter)}</span>${esc(c.name)}</h3>
  <div class="bar"><button class="btn main" id="cNew">➕ New post</button>${c.url?'<button class="btn" id="cOpen">▶ Open channel</button>':''}<button class="btn" id="cEdit">✏️ Edit</button></div>
  <p class="muted">${L.filter(p=>!isDone(p)).length} to do · ${L.filter(isDone).length} uploaded</p>${grouped(L.sort((a,b)=>(b.when||'').localeCompare(a.when||'')))}`);
  $('cNew').onclick=()=>postSheet(null,c.id);$('cEdit').onclick=()=>chanEdit(c);if($('cOpen'))$('cOpen').onclick=()=>window.open(c.url,'_blank');}
function chanEdit(c){const isNew=!c;c=c?JSON.parse(JSON.stringify(c)):{id:'c'+Date.now(),name:'',platform:'YouTube',color:COLORS[S.channels.length%COLORS.length],letter:'',url:'',on:true,note:''};
  openSheet(`<h3>${isNew?'➕ Add channel':'✏️ Edit channel'}</h3>
  <div class="f"><label>Name</label><input type="text" id="kName" value="${esc(c.name)}" placeholder="New channel name"></div>
  <div class="row2"><div class="f"><label>Where</label><select id="kPlat">${['YouTube','TikTok','YouTube + TikTok','Instagram','Facebook','Other'].map(o=>`<option ${o===c.platform?'selected':''}>${o}</option>`).join('')}</select></div>
  <div class="f"><label>Letter</label><input type="text" id="kLet" maxlength="2" value="${esc(c.letter)}" placeholder="auto"></div></div>
  <div class="f"><label>Colour</label><div class="colors" id="kCol">${COLORS.map(x=>`<button style="background:${x}" data-col="${x}" class="${x===c.color?'on':''}"></button>`).join('')}</div></div>
  <div class="f"><label>Channel link</label><input type="url" id="kUrl" value="${esc(c.url)}" placeholder="https://youtube.com/@..."></div>
  <div class="set"><div class="top"><span>Channel on</span><label class="sw"><input type="checkbox" id="kOn" ${c.on?'checked':''}><span></span></label></div><div class="help">Off = hidden everywhere, posts kept. Turn it on again any time.</div></div>
  <div class="bar"><button class="btn main" id="kSave">Save</button><button class="btn" id="kClose">Close</button></div>
  ${isNew?'':'<div class="bar"><button class="btn red" id="kDel">Delete channel and its posts</button></div>'}`);
  $('kCol').onclick=e=>{const b=e.target.closest('[data-col]');if(!b)return;c.color=b.dataset.col;document.querySelectorAll('#kCol button').forEach(x=>x.classList.toggle('on',x===b));};
  $('kClose').onclick=closeSheet;
  $('kSave').onclick=()=>{c.name=$('kName').value.trim();if(!c.name){toast('Type a name');return;}c.platform=$('kPlat').value;c.letter=($('kLet').value.trim()||c.name[0]).toUpperCase();c.url=$('kUrl').value.trim();c.on=$('kOn').checked;
    const i=S.channels.findIndex(x=>x.id===c.id);if(i<0)S.channels.push(c);else S.channels[i]=c;save();closeSheet();drawAll();toast('Saved ✓');};
  if($('kDel'))$('kDel').onclick=()=>{const n=S.posts.filter(p=>p.ch===c.id).length;if(!confirm(`Delete ${c.name} and its ${n} post(s) for good?\n(Tip: turning the channel off keeps everything.)`))return;
    S.channels=S.channels.filter(x=>x.id!==c.id);S.posts=S.posts.filter(p=>p.ch!==c.id);save();closeSheet();drawAll();};}

/* ---------- clicks everywhere ---------- */
document.addEventListener('click',async e=>{
  const pp=e.target.closest('[data-post]');if(pp){postSheet(S.posts.find(p=>p.id===pp.dataset.post));return;}
  const cc=e.target.closest('[data-chan]');if(cc){chanSheet(chOf(cc.dataset.chan));return;}
  const cp=e.target.closest('[data-copy]');if(cp){const v=$(cp.dataset.copy).value;try{await navigator.clipboard.writeText(v);toast('Copied ✓');}catch(_){prompt('Copy:',v);}return;}
  const sp=e.target.closest('[data-step]');if(sp){const s=SETTINGS.find(x=>x.k===sp.dataset.step);S.settings[s.k]=Math.max(s.min,Math.min(s.max,(+set(s.k)||s.d)+(+sp.dataset.d)));save();drawMore();feedTimer();return;}
  const id=e.target.id;
  if(id==='addCh')chanEdit(null);
  else if(id==='defaults'){if(confirm('Put every setting back to default? (Channels and posts stay.)')){SETTINGS.forEach(s=>S.settings[s.k]=s.d);save();drawAll();feedTimer();}}
  else if(id==='showHidden'){const H=S.posts.filter(p=>p.hidden);openSheet(`<h3>🙈 Hidden posts</h3>${H.length?H.map(postCard).join(''):'<div class="empty">No hidden posts.</div>'}<div class="bar"><button class="btn" onclick="document.getElementById('sheet').style.display='none'">Close</button></div>`);}
  else if(id==='exp')exportData();
  else if(id==='imp')$('fileImport').click();
  else if(id==='feedNow')feed(true);
  else if(id==='upd')checkUpdate();});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.set;if(!k)return;S.settings[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(k==='planPeriod')planP=null;save();drawAll();feedTimer();});
$('fab').onclick=()=>postSheet(null);

/* ---------- export / import ---------- */
function exportData(){const b=new Blob([JSON.stringify({app:'Studio X',version:VERSION,saved:new Date().toISOString(),data:S},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`Studio X backup ${dayKey(now())}.json`;document.body.appendChild(a);a.click();a.remove();toast('Backup saved ✓');}
$('fileImport').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;if(!Array.isArray(d.channels)||!Array.isArray(d.posts))throw 0;
  if(!confirm(`Replace everything with this backup?\n${d.channels.length} channels, ${d.posts.length} posts.\n(Export first if you are not sure.)`))return;S=Object.assign({channels:[],posts:[],settings:{},feed:{last:0,sha:''}},d);
  for(const s of SETTINGS)if(!(s.k in S.settings))S.settings[s.k]=s.d;save();drawAll();toast('Backup loaded ✓');}catch(_){alert('This is not a Studio X backup file.');}};r.readAsText(f);};

/* ---------- BOT FEED: laptop bots write studiox/feed.json in the private mailbox (KwabenaPhill/surestake707-sync).
   Format: {"updated":"...","posts":[{"id":"rankx-2026-11-02","channel":"RankX Football","kind":"Video","title":"...",
   "when":"2026-11-02T18:00","ticks":{"build":true,"thumb":true,"text":true,"upload":false},"link":"","caption":"","tags":""}]}
   Bot posts are matched by id: the bot's fields update, your own notes stay. Unknown channel names are added (you can turn them off). */
const REPO='KwabenaPhill/surestake707-sync';
function key(){let a={},b={};try{a=JSON.parse(localStorage.getItem('fixhub_sync')||'{}');}catch(e){}try{b=JSON.parse(localStorage.getItem('ss707_sync')||'{}');}catch(e){}return a.token||b.token||'';}
let feedErr='';
function feedText(){if(!set('feedOn'))return 'Bot feed is off (More > Settings).';if(!key())return 'Not connected yet: tap 📝 > 🔗 Laptop sync and paste the mailbox key once. It stays on this phone.';
  if(feedErr)return 'Problem: '+feedErr;return S.feed.last?'Last bot news: '+new Date(S.feed.last).toLocaleString():'Connected. Waiting for the first bot news.';}
function feedLine(){$('feedLine').textContent=set('feedOn')&&key()?(feedErr?'🤖 Bot feed: problem':S.feed.last?'🤖 Bots in step · '+tm(S.feed.last):'🤖 Bot feed on'):'';const fi=$('feedInfo');if(fi)fi.textContent=feedText();}
async function feed(manual){if(!set('feedOn')||!key()||!navigator.onLine){feedLine();if(manual)toast(feedText());return;}
  try{const r=await fetch(`https://api.github.com/repos/${REPO}/contents/studiox/feed.json`,{cache:'no-store',headers:{Authorization:'Bearer '+key(),Accept:'application/vnd.github+json'}});
    if(r.status===404){feedErr='';feedLine();if(manual)toast('No bot news yet');return;}
    const j=await r.json();if(!r.ok)throw new Error('GitHub '+r.status);
    if(j.sha===S.feed.sha){feedErr='';feedLine();if(manual)toast('Up to date ✓');return;}
    const d=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));let n=0;
    for(const b of d.posts||[]){let c=S.channels.find(x=>x.name.toLowerCase()===String(b.channel||'').toLowerCase());
      if(!c&&b.channel){c={id:'c'+Date.now()+n,name:b.channel,platform:'YouTube',color:COLORS[S.channels.length%COLORS.length],letter:b.channel[0].toUpperCase(),url:'',on:true,note:''};S.channels.push(c);}
      if(!c)continue;const id='bot:'+b.id;let p=S.posts.find(x=>x.id===id);
      if(!p){p={id,src:'bot',notes:'',ticks:{}};S.posts.push(p);}
      Object.assign(p,{ch:c.id,kind:b.kind||p.kind||'Video',title:b.title||p.title||'',when:b.when||p.when||'',link:b.link||p.link||'',caption:b.caption||p.caption||'',tags:b.tags||p.tags||''});
      p.ticks=Object.assign(p.ticks||{},b.ticks||{});n++;}
    S.feed={last:Date.now(),sha:j.sha};feedErr='';save();drawAll();if(manual)toast(n+' bot post(s) updated ✓');}
  catch(e){feedErr=String(e.message||e).slice(0,60);if(manual)toast('Bot feed problem');}feedLine();}
let ft=null;function feedTimer(){clearInterval(ft);ft=setInterval(()=>{if(!document.hidden)feed();},Math.max(1,+set('feedMins')||5)*60000);feedLine();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(feed,1500);});

/* ---------- app update ---------- */
async function checkUpdate(){try{const r=await navigator.serviceWorker.getRegistration();if(r){await r.update();}toast('Checking… the app reloads if there is a new version');setTimeout(()=>location.reload(),1500);}catch(_){location.reload();}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='activated'){toast('APP UPDATED ✓');setTimeout(()=>location.reload(),900);}});});}).catch(()=>{});}

load().then(()=>{drawAll();showTab(set('startTab')||'home');feedTimer();setTimeout(feed,3000);});
window.__sx={get S(){return S;},showTab,feed};
})();
</script>

<script>
/* FIX NOTES + FIX HUB SYNC (Philip, 28 Oct 2026): notes go both ways with the laptop Fix Hub through the private
   mailbox KwabenaPhill/surestake707-sync, folder fixhub/. This app only gets its own category. */
(function(){
  const APP='Studio X';
  const SLUG=APP.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const DB='fixnotes_'+APP.replace(/\s+/g,'_').toLowerCase();
  let newPics=[];const $=id=>document.getElementById(id);$('fxApp').textContent=APP;
  function idb(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('n',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});}
  async function all(){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('n').objectStore('n').getAll();q.onsuccess=()=>ok(q.result.sort((a,b)=>a.id-b.id));q.onerror=()=>ok([]);});}catch(e){return[];}}
  async function put(n){const d=await idb();return new Promise(ok=>{const t=d.transaction('n','readwrite');t.objectStore('n').put(n);t.oncomplete=ok;});}
  async function del(id){const d=await idb();return new Promise(ok=>{const t=d.transaction('n','readwrite');t.objectStore('n').delete(id);t.oncomplete=ok;});}
  const st=n=>n.status||(n.sent?'sent':'new');
  async function save(n){n.upd=Date.now();n.sent=st(n)!=='new';await put(n);kick();}
  function shrink(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.82));};im.onerror=()=>ok(null);im.src=r.result;};r.readAsDataURL(file);});}
  function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  async function draw(){const L=(await all()).filter(n=>!n.gone);const open=L.filter(n=>st(n)==='new');const c=$('fxCount');c.style.display=open.length?'block':'none';c.textContent=open.length;
    /* 1.3 (Philip, 30 Oct): grouped like the laptop Fix Hub - New on top, then Sent to Claude, then Fixed */
    const card=n=>`<div class="note"><button class="x" data-del="${n.id}">✕</button><small>${new Date(n.id).toLocaleString()}${st(n)==='sent'?' · sent ✓':st(n)==='fixed'?' · fixed ✅':''}${n.src==='laptop'?' · 💻 from laptop':''}</small><div>${esc(n.text||'(picture only)').replace(/\n/g,'<br>')}</div>${(n.pics||[]).length?`<div class="pics">${n.pics.map(p=>`<img src="${p}">`).join('')}</div>`:''}</div>`;const R=L.slice().reverse();const gN=R.filter(n=>st(n)==='new'),gS=R.filter(n=>st(n)==='sent'),gF=R.filter(n=>st(n)==='fixed');
    const grp=(t,a,open)=>a.length?`<details ${open?'open':''} style="margin:10px 0"><summary style="cursor:pointer;font-weight:700;padding:8px 0">${t} (${a.length})</summary>${a.map(card).join('')}</details>`:'';
    $('fxList').innerHTML=L.length?(`<div style="font-weight:700;margin:10px 0 4px">🆕 New (${gN.length})</div>`+(gN.length?gN.map(card).join(''):'<div class="muted">Nothing new. Sent notes are below.</div>')+grp('📤 Sent to Claude',gS,false)+grp('✅ Fixed',gF,false)):'<div class="muted">No notes yet.</div>';
    syncLine();}
  function drawNew(){$('fxNewPics').innerHTML=newPics.map(p=>`<img src="${p}">`).join('');}
  $('fxBtn').onclick=()=>{$('fxSheet').style.display='block';draw();kick();};
  $('fxClose').onclick=()=>{$('fxSheet').style.display='none';};
  $('fxSheet').onclick=async e=>{if(e.target.id==='fxSheet')$('fxSheet').style.display='none';const d=e.target.closest('[data-del]');
    if(d&&confirm('Delete this note? (also from the laptop Fix Hub)')){const n=(await all()).find(x=>x.id===+d.dataset.del);if(n){n.gone=true;n.pics=[];n.text='';await save(n);}draw();}};
  $('fxPic').onclick=()=>$('fxFile').click();
  $('fxFile').onchange=async e=>{for(const f of e.target.files){const p=await shrink(f);if(p)newPics.push(p);}e.target.value='';drawNew();};
/* VOICE 3 (30 Oct 2026, Philip: "auto-correct removes my words, long recordings type, clear and type again"):
   - it is Google's voice (Chrome sends your voice to Google), now with NOTHING removed:
     no more "very very" -> "very", no word ever deleted
   - the box only gets FINAL words; the words still being heard show in a small grey line under the box
     (no more typing, clearing and typing again)
   - never stops by itself until you tap Stop; the phone keeps the session open too (no lost words between phrases)
   - Auto-correct setting next to the Speak button: "Light" (default: app names, I, capitals, one full stop at the end)
     or "Off" (exactly what Google heard) */
const VOICE_FIXES=[[/\b(mad|mat|match|magic)\s*vision\b/gi,'Match Vision'],
 [/\bvision\s*(period|premier|premiun|primary)\b/gi,'Vision Premium'],
 [/\b(sure|shore|show)\s*(stick|stack|steak|stake|state)\b/gi,'Sure Stake'],[/\bsure\s*stake\s*(seven\s*o\s*seven|7\s*0\s*7)\b/gi,'Sure Stake 707'],
 [/\brank\s*(x|ex|eggs)\b/gi,'RankX'],[/\b(fix|fixed|fixe)\s*hub\b/gi,'Fix Hub'],[/\b(face|fix|fixed)\s*lab\b/gi,'FIX LAB'],
 [/\b(ballon|balloon|balon)\s*(d\s*'?\s*or|door|dor|d'or)\b/gi,"Ballon d'Or"],
 [/\bgame\s*(zeus|juice|zeuss)\b/gi,'Game Zeus'],[/\b(velox|vellox)\b/gi,'Vellox'],
 [/\b(cine|sin|seen)\s*cascade\b/gi,'Cine Cascade'],[/\bink\s*age\b/gi,'Ink Age'],[/\b(bolt|vault)\s*app\b/gi,'Vault app'],
 [/\byou\s*tube\b/gi,'YouTube'],[/\btele\s*gram\b/gi,'Telegram'],[/\bgit\s*hub\b/gi,'GitHub'],[/\bwhats\s*app\b/gi,'WhatsApp'],
 [/\bclaude\b/gi,'Claude'],[/\bm\s*bappe\b|\bmbape\b|\bembappe\b/gi,'Mbappe'],[/\bhaland\b|\bhalland\b/gi,'Haaland']];
function voiceMode(){try{return localStorage.getItem('voice_clean')||'light';}catch(_){return 'light';}}
function voiceClean(t){
  t=String(t||'').replace(/\s+/g,' ').trim();
  if(!t||voiceMode()==='off')return t;
  for(const [a,b] of VOICE_FIXES)t=t.replace(a,b);
  try{const own=JSON.parse(localStorage.getItem('voice_fixes')||'[]');for(const [a,b] of own)t=t.replace(new RegExp('\\b'+a+'\\b','gi'),b);}catch(_){}
  t=t.replace(/\bi\b/g,'I').replace(/\bi'(m|ve|ll|d)\b/gi,(m,x)=>"I'"+x.toLowerCase());
  t=t.replace(/\s+([.,!?])/g,'$1').replace(/([.!?])(?=[A-Za-z])/g,'$1 ');
  t=t.replace(/(^|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
  if(!/[.!?]$/.test(t))t+='.';
  return t;}
function voiceTyping(btn,box,tell){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const st={on:false,rec:null,done:'',sess:'',live:'',base:'',lang:'',t0:0,tick:null,lock:null};
  try{st.lang=localStorage.getItem('voice_lang')||'en-GH';}catch(_){st.lang='en-GH';}
  const android=/Android/i.test(navigator.userAgent);
  const liveEl=document.createElement('div');
  liveEl.style.cssText='color:#9a9a9a;font-style:italic;font-size:13px;min-height:0;margin:4px 2px 0;white-space:pre-wrap';
  box.insertAdjacentElement('afterend',liveEl);
  const sel=document.createElement('select');
  sel.title='Auto-correct: Light = names, I and capitals (never removes a word). Off = exactly what Google heard.';
  sel.style.cssText='margin-left:6px;padding:6px;border-radius:10px;border:1px solid #333;background:#151515;color:#ddd;font-size:13px;max-width:150px';
  sel.innerHTML='<option value="light">Auto-correct: Light</option><option value="off">Auto-correct: Off</option>';
  sel.value=voiceMode();sel.onchange=()=>{try{localStorage.setItem('voice_clean',sel.value);}catch(_){}};
  btn.insertAdjacentElement('afterend',sel);
  const label=()=>{const s=Math.floor((Date.now()-st.t0)/1000);btn.textContent=`⏹ Stop ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
  const show=()=>{box.value=[st.base,st.done,st.sess].filter(Boolean).join(' ');box.scrollTop=box.scrollHeight;
    liveEl.textContent=st.live?'🎤 '+st.live:'';};
  const keep=()=>{const s=[st.sess,st.live].filter(Boolean).join(' ').trim();st.sess='';st.live='';
    if(!s)return;if(st.done&&!/[.!?]$/.test(st.done))st.done+='.';st.done=(st.done+' '+s).trim();};
  function one(){
    let r;try{r=new SR();}catch(e){stop();return;}
    st.rec=r;r.lang=st.lang;r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
    r.onresult=e=>{const fin=[];let tmp='';
      for(let i=0;i<e.results.length;i++){const x=String(e.results[i][0].transcript||'').trim();if(!x)continue;
        if(e.results[i].isFinal){const last=fin[fin.length-1];
          if(android&&last&&x.toLowerCase().startsWith(last.toLowerCase()))fin[fin.length-1]=x;   // phone repeats the words: keep the longest
          else if(!(android&&last&&last.toLowerCase().startsWith(x.toLowerCase())))fin.push(x);}
        else tmp+=' '+x;}
      st.sess=fin.join(' ');st.live=tmp.trim();show();};
    r.onerror=e=>{if(e.error==='language-not-supported'&&st.lang!=='en-US'){st.lang='en-US';try{localStorage.setItem('voice_lang','en-US');}catch(_){}}
      else if(e.error==='not-allowed'||e.error==='service-not-allowed'){st.on=false;tell&&tell('Allow the microphone for this page, then tap Speak again.');}};
    r.onend=()=>{keep();show();if(st.on)one();else end();};
    try{r.start();}catch(e){setTimeout(()=>{if(st.on)one();},300);}
  }
  function end(){clearInterval(st.tick);st.tick=null;btn.textContent='🎤 Speak';btn.classList.remove('rec');
    try{st.lock&&st.lock.release();}catch(_){}st.lock=null;
    keep();const said=voiceClean(st.done);box.value=[st.base,said].filter(Boolean).join(' ');st.done='';liveEl.textContent='';
    box.dispatchEvent(new Event('input',{bubbles:true}));}
  function stop(){st.on=false;try{if(st.rec)st.rec.stop();else end();}catch(_){end();}}
  btn.onclick=async()=>{
    if(!SR){tell&&tell('Voice typing is not in this browser. Tap the box and use the 🎤 on your keyboard (or Win+H).');box.focus();return;}
    if(st.on){stop();return;}
    st.on=true;st.done='';st.sess='';st.live='';st.base=box.value.trim();st.t0=Date.now();
    btn.classList.add('rec');label();st.tick=setInterval(label,1000);
    try{if(navigator.wakeLock)st.lock=await navigator.wakeLock.request('screen');}catch(_){}
    one();};
  return st;}
  voiceTyping($('fxMic'),$('fxText'),m=>alert(m));
  $('fxSave').onclick=async()=>{const t=$('fxText').value.trim();if(!t&&!newPics.length){alert('Write something or add a picture first.');return;}
    await save({id:Date.now(),text:t,pics:newPics,status:'new',src:'phone'});$('fxText').value='';newPics=[];drawNew();draw();};
  function bundle(L){return `FIXES FOR ${APP.toUpperCase()} (${L.length} notes, ${new Date().toLocaleDateString()})\n\n`+L.map((n,i)=>`${i+1}. ${n.text||'(see picture)'}${(n.pics||[]).length?`  [pictures: ${n.pics.map((_,k)=>`note${i+1}-${k+1}.jpg`).join(', ')}]`:''}`).join('\n\n');}
  async function toFile(data,name){const b=await (await fetch(data)).blob();return new File([b],name,{type:'image/jpeg'});}
  const openNotes=async()=>(await all()).filter(n=>!n.gone&&st(n)==='new');
  $('fxCopy').onclick=async()=>{const L=await openNotes();try{await navigator.clipboard.writeText(bundle(L));alert('Copied ✓');}catch(e){prompt('Copy this:',bundle(L));}};
  $('fxSend').onclick=async()=>{const L=await openNotes();if(!L.length){alert('No new notes to send.');return;}
    const txt=bundle(L);const files=[new File([txt],'fixes.txt',{type:'text/plain'})];
    for(let i=0;i<L.length;i++)for(let k=0;k<(L[i].pics||[]).length;k++)files.push(await toFile(L[i].pics[k],`note${i+1}-${k+1}.jpg`));
    try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text:txt,title:'Fixes for '+APP});}
        else{await navigator.share({text:txt,title:'Fixes for '+APP});}
        if(confirm('Did it send? Mark these notes as sent?')){for(const n of L){n.status='sent';await save(n);}draw();}}
    catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(txt);alert('Sharing is not available here: the text is copied. Add the pictures by hand.');}catch(_){prompt('Copy this:',txt);}}};
  $('fxDone').onclick=async()=>{const L=(await all()).filter(n=>!n.gone&&st(n)!=='new');if(!L.length){alert('Nothing sent or fixed yet.');return;}if(confirm(`Clear ${L.length} sent or fixed note(s)? (also from the laptop Fix Hub)`)){for(const n of L){n.gone=true;n.pics=[];n.text='';await save(n);}draw();}};

  // ---------- laptop Fix Hub sync (private GitHub mailbox) ----------
  const REPO='KwabenaPhill/surestake707-sync';
  function cfg(){let a={},b={};try{a=JSON.parse(localStorage.getItem('fixhub_sync')||'{}');}catch(e){}try{b=JSON.parse(localStorage.getItem('ss707_sync')||'{}');}catch(e){}
    return {repo:a.repo||b.repo||REPO,token:a.token||b.token||'',on:a.on!==false,own:!!a.token};}
  const SK='fx_sync_'+SLUG;let ss={sha:{},pushed:{},pics:{}};try{Object.assign(ss,JSON.parse(localStorage.getItem(SK)||'{}'));}catch(e){}
  const saveSS=()=>{try{localStorage.setItem(SK,JSON.stringify(ss));}catch(e){}};
  let busy=false,lastErr='',lastOk=0,kt=null;
  const b64=s=>btoa(unescape(encodeURIComponent(s))),unb64=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,''))));
  async function gh(method,path,body){const c=cfg();const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${path}`,{method,cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
    if(r.status===404)return null;const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error('GitHub '+r.status+' '+(j.message||''));return j;}
  async function putFile(path,content,msg){for(let t=0;t<2;t++){const body={message:msg,content};if(ss.sha[path])body.sha=ss.sha[path];
      try{const j=await gh('PUT',path,body);ss.sha[path]=j&&j.content&&j.content.sha;return;}
      catch(e){if(t===0&&/409|422/.test(e.message)){const cur=await gh('GET',path);ss.sha[path]=cur&&cur.sha;continue;}throw e;}}}
  async function pull(){const list=await gh('GET','fixhub/notes');if(!Array.isArray(list))return false;let ch=false;const by={};(await all()).forEach(n=>by[n.id]=n);
    for(const f of list){const m=/^(.+)__(\d+)\.json$/.exec(f.name);if(!m||m[1]!==SLUG)continue;const path='fixhub/notes/'+f.name;if(ss.sha[path]===f.sha)continue;
      const j=await gh('GET',path);if(!j)continue;ss.sha[path]=j.sha;let r;try{r=JSON.parse(unb64(j.content||''));}catch(e){continue;}
      const id=+m[2],loc=by[id],lu=loc?(loc.upd||loc.id):0,ru=r.upd||0;
      if(r.deleted){if(loc&&ru>=lu){await del(id);delete ss.pushed[id];ch=true;}continue;}
      if(loc&&lu>=ru)continue;
      let pics=loc&&(loc.pics||[]).length===(r.pics||[]).length?loc.pics:[];
      if(!pics.length)for(const p of r.pics||[]){const im=await gh('GET',p);if(im&&im.content){pics.push('data:image/jpeg;base64,'+im.content.replace(/\s/g,''));ss.pics[p]=1;}}
      await put({id,text:r.text||'',pics,status:r.status||'new',sent:(r.status||'new')!=='new',upd:ru,src:r.src||'laptop'});ss.pushed[id]=ru;ch=true;}
    saveSS();return ch;}
  async function push(){for(const n of await all()){const u=n.upd||n.id;if((ss.pushed[n.id]||0)>=u)continue;const path=`fixhub/notes/${SLUG}__${n.id}.json`;
      if(n.gone){await putFile(path,b64(JSON.stringify({id:String(n.id),cat:APP,deleted:true,upd:u,src:n.src||'phone'})),`fix: delete ${APP} #${n.id}`);await del(n.id);delete ss.pushed[n.id];saveSS();continue;}
      const pp=[];for(let k=0;k<(n.pics||[]).length;k++){const p=`fixhub/pics/${SLUG}__${n.id}-${k+1}.jpg`;if(!ss.pics[p]){await putFile(p,n.pics[k].split(',')[1],`fix: picture ${APP} #${n.id}`);ss.pics[p]=1;saveSS();}pp.push(p);}
      await putFile(path,b64(JSON.stringify({id:String(n.id),cat:APP,text:n.text||'',status:st(n),upd:u,src:n.src||'phone',pics:pp})),`fix: ${APP} #${n.id}`);ss.pushed[n.id]=u;saveSS();}}
  async function run(){const c=cfg();if(!c.token||!c.on||busy||!navigator.onLine)return;busy=true;
    try{const ch=await pull();await push();lastOk=Date.now();lastErr='';if(ch||$('fxSheet').style.display==='block')draw();else draw();}
    catch(e){lastErr=String(e.message||e).slice(0,80);}finally{busy=false;syncLine();}}
  function kick(){clearTimeout(kt);kt=setTimeout(run,1200);}
  function syncLine(){const e=$('fxSyncLine');if(!e)return;const c=cfg();
    e.textContent=!c.token?'💻 Laptop Fix Hub: off · tap 🔗 Laptop sync to connect':!c.on?'💻 Laptop Fix Hub: turned off':lastErr?'💻 Laptop Fix Hub: problem · '+lastErr:lastOk?'💻 Laptop Fix Hub: in step ✓ '+new Date(lastOk).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'💻 Laptop Fix Hub: on';}
  $('fxKey').onclick=()=>{const c=cfg();
    if(!c.token){const t=prompt('Paste the GitHub key for the private mailbox (surestake707-sync). It stays only on this phone:');if(!t||!t.trim())return;
      try{localStorage.setItem('fixhub_sync',JSON.stringify({repo:REPO,token:t.trim(),on:true}));}catch(e){}run();return;}
    if(confirm(c.on?'Laptop sync is on. Sync now? (Cancel = turn it off)':'Laptop sync is off. Turn it on?')){if(!c.on){let a={};try{a=JSON.parse(localStorage.getItem('fixhub_sync')||'{}');}catch(e){}a.on=true;localStorage.setItem('fixhub_sync',JSON.stringify(a));}run();}
    else if(c.on){let a={};try{a=JSON.parse(localStorage.getItem('fixhub_sync')||'{}');}catch(e){}a.on=false;localStorage.setItem('fixhub_sync',JSON.stringify(a));syncLine();}};
  setInterval(()=>{if(!document.hidden)run();},45000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(run,2000);});
  window.addEventListener('online',()=>run());
  setTimeout(run,5000);
  draw();
})();
